name: CI

# 常规门禁:每次 push(main)/PR 同时验证 CLI 与桌面端两条构建链,
# 以及 CUA 冒烟与 win32 addon 对齐。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Lint (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile && node -e "require('node:fs').accessSync('node_modules/bundle-require/node_modules/esbuild/lib/main.js')" || pnpm install --frozen-lockfile --force
      - name: Freshness baseline
        run: node scripts/check-workspace-freshness.mjs
        continue-on-error: true
      # 本分支 typecheck 脚本尾段对 apps/drora-cli/packages/bootstrap 跑 tsc
      #（Phase 2 接入的 CLI 质量门）——bootstrap 经 node_modules dist 消费
      # @drora/contracts|adapters|i18n|core 类型，全新 CI 环境无这些 dist 会全量
      # TS2307（2026-10-28 实证）。typecheck 前先构建 bootstrap 的 workspace 依赖闭包。
      - name: Build bootstrap dependency closure
        run: pnpm --dir apps/drora-cli exec turbo run build --filter=@drora/bootstrap^...
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Relay V2 server contract suite
        # 自建 relay 服务端(specs/relay-v2-server.md)的 L0 契约套件+差异测试:
        # 真实 loopback 服务器+真实定时器,fileParallelism=false 串行执行(约 15s)。
        run: pnpm --filter @drora/relay-v2-server test
      - name: Obsidian knowledge UI and evidence transport regression
        # EC-2（e2e-a-2，2026-10-18 终审）修复：rootJwtInvalidBroadcastGate
        # （ui-auth JWT 广播门控回归）此前不在任何 CI 通道，追加进本清单；
        # knowledgeReviewView.test.tsx 是 .tsx——v3.17.1 合并（S5，UP05372）
        # 随上游删除 packages/ui/vitest.config.ts 后，--dir packages/ui 的本地
        # 执行通道不复存在（根配置的相对 include 会以错误 root 解析）。
        # 现按 D01 三工程结构把它显式登记进 scripts/drora-test-files.json
        # （drora 工程，--project 选择），并改根级调用（完成度审查 2026-11-01
        # 发现该测试曾全通道失执行——CI 与本地同现 No test files found）。
        # B7 对账（specs/obsidian-vault-plugin-extraction.md §10）修复死条目：
        # ① conversationSelectionReference / oauthCachedSessionRestore——上游 v3.17.2
        #   合并（b3e44cb2a）已删除这两个测试文件，filter 为死条目（vitest 在其余
        #   filter 有匹配时对未匹配项静默忽略，CI 不红但测试也从不执行）；
        # ② knowledgeAskModel / knowledgeEvidenceVerification——实测为 node:test 面
        #   （文件头 import test from "node:test"），vitest 无法执行 node:test 注册的
        #   suite（同 spec 注 1 分流机制），在本 vitest 行属静默 no-op，本地实测本行
        #   13/17 文件执行、这两个无任何测试结果——移入下方 node --test 步骤真实执行。
        # P7 本体清除（specs/obsidian-vault-phase2-true-extraction.md §1-C10）：C5b
        # 生产端/面板模型测试（handoff/sources/navigation/transaction/quoteReveal/
        # review*/insights*/connections*/askModel 等）随实现拆除；保留 C5a 渲染/投影/
        # 失败语义端（citation markdown/turn citations/message 渲染/open 事件总线/
        # openFeedback/sendFailure）+ 既有 rootJwtInvalidBroadcastGate。
        run: |
          pnpm exec vitest run packages/ui/test/knowledgeTurnCitations.test.ts packages/ui/test/knowledgeCitationMarkdown.test.ts packages/ui/test/messageResponseKnowledgeCitation.test.ts packages/ui/test/messageCitationOpenIntegration.test.ts packages/ui/test/knowledgeCitationOpenFeedback.test.ts packages/ui/test/knowledgeEvidenceSendFailure.test.ts packages/ui/test/rootJwtInvalidBroadcastGate.test.ts
      - name: Obsidian source-to-receipt integration and CLI admission gate
        # The bootstrap handler imports @drora/contracts/dist at runtime. Run that
        # wiring suite in cli-build after its dependency closure has been built.
        # EC-2（e2e-a-2，2026-10-18 终审）修复：knowledgeChunkerTokenizer
        # （分词器虚词表回归）此前不在任何 CI 通道，追加进本清单。
        # B5（specs/obsidian-vault-plugin-extraction.md §10）：vault_neighbors 服务面
        # 近邻测试与 CLI handler 契约测试（node:test 面）登记本清单。
        # P3（specs/obsidian-vault-phase2-true-extraction.md §1-C10/§10-P3）：services
        # knowledge/obsidian 测试随实现迁入 obsidian-plugin/test（迁后路径，逐文件
        # HEAD 对照头注释），本清单同步改指；bootstrap/core/ui 条目不受影响。
        # B7 对账（specs/obsidian-vault-plugin-extraction.md §10）登记补齐：node:test
        # 面文件按契约（vitest.config.ts 头注释 / generate-drora-test-files.mjs）不进
        # drora-test-files.json，其显式 CI 登记通道即本清单——此前 services knowledge
        # 全集 25 个 node 面文件仅 11 个登记、14 个只靠保留集自动发现（无 CI 通道）；
        # 此处补齐至全集，并把上方 vitest 行移出的 knowledgeAskModel /
        # knowledgeEvidenceVerification 与同面的 knowledgeInsightsModel 一并登记。
        run: >-
          node --import tsx --test
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeE2EFullChain.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeIndexQuery.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeReviewWritePath.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeReview.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/obsidianVaultConfig.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeReceiptIsolation.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeReviewFreshApproval.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeReviewOwnership.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/obsidianVaultAtomicCreate.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeChunkerTokenizer.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeNeighbors.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeAskUiFlow.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeAutoIndex.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeDecisionPipeline.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeDecisionPolicy.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeEmbeddingInput.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeEvaluationHarness.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeEvidence.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeFtsColumns.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeInsights.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeLeaseFencing.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeLocalEmbedding.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeSemanticAccuracy.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeVaultSearchProtocol.test.ts
          apps/drora-cli/packages/obsidian-plugin/test/knowledgeVectorRecall.test.ts
      - name: Gen UI asset checkout integrity (autocrlf)
        run: node --test scripts/test/gen-ui-asset-checkout.test.mjs
      - name: Architecture boundaries (changed)
        run: pnpm architecture:check -- --changed
      # fmt 基线未定(上游从未统一格式化,2900+ 文件差异),进入 CI 只会产生
      # 永久红灯;待仓库决定格式化基线后再启用。
      # - name: Format check
      #   run: pnpm fmt:check

  smoke:
    name: CUA smoke + helper bundle (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile && node -e "require('node:fs').accessSync('node_modules/bundle-require/node_modules/esbuild/lib/main.js')" || pnpm install --frozen-lockfile --force
      - name: drora-cua smoke (mock broker)
        run: node packages/zcode-cua/test/restored-smoke.mjs
      - name: Helper typecheck + Windows bundle build
        run: |
          pnpm --filter @drora/drora-cua-helper-runtime typecheck
          pnpm --filter @drora/drora-cua-helper-runtime build
      - name: Upload helper bundle
        uses: actions/upload-artifact@v4
        with:
          name: helper-windows-bundle
          path: packages/zcode-cua-helper/dist/windows-helper.js
          retention-days: 7

  cli-build:
    name: CLI bundle (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile && node -e "require('node:fs').accessSync('node_modules/bundle-require/node_modules/esbuild/lib/main.js')" || pnpm install --frozen-lockfile --force
      - name: Build plugin MCP runtimes
        # node-repl-host 依赖 @drora/core、@drora/contracts 的 dist,
        # 必须先走依赖闭包。turbo 2.9 在「子目录 turbo.json + 仓库根 workspace」
        # 布局下找不到根配置（分叉原命令从未真正执行过，filter 匹配不到包被
        # 静默跳过），改走仓库正统的有序闭包构建脚本（dev 同款）。
        run: node scripts/build-desktop-agent-cli.mjs
        shell: bash
      - name: Build plugin MCP runtimes (excluded seed packages)
        run: >-
          for pkg in browser-use-plugin android-emulator-plugin ios-simulator-plugin obsidian-plugin; do
          pnpm --dir "apps/drora-cli/packages/$pkg" run build || exit 1;
          done
        shell: bash
      - name: Obsidian evidence provenance (built CLI dependency closure)
        # P7 本体清除（spec §1-C6/C8）：evidence-session-wiring（admission 复验 gate 接线）
        # 随 CLI gate 拆除；保留 knowledge-user-input-provenance（投影/冷恢复消费端，
        # 已改写为 P7 语义：新账本不持久化 refs、旧账本条目仍可投影、伪造形状 fail-closed）。
        run: node --import tsx --test apps/drora-cli/packages/bootstrap/test/knowledge-user-input-provenance.test.mjs
      - name: S03 write-safety permission regressions
        run: >-
          node --import tsx --test
          apps/drora-cli/packages/core/test/permission-p0-executor.test.ts
          apps/drora-cli/packages/core/test/write-tier-policy.test.ts
          apps/drora-cli/packages/core/test/permission-service-write-tier.test.ts
          apps/drora-cli/packages/core/test/permission-suggestions.test.ts
          apps/drora-cli/packages/core/test/memory-file-permission.test.ts
          apps/drora-cli/packages/core/test/bash-command-rule-evaluator.test.ts
          apps/drora-cli/packages/core/test/conversation-quotes.test.ts
      # EC-2（e2e-a-2 / 阻塞项①，2026-10-18 终审）修复：core/tests vitest 目录此前
      # 不在任何工作流执行集内（ci.yml 只跑 core/test 的 7 个 node--test 文件），
      # cli-p0-5 改动 ToolCallStarted readOnly 省键契约时既有测试变红却被静默合入。
      # 本步骤补上该 CI 通道：tool-call-started-capability 锁定省键契约回归，
      # mcp-tool-bridge 锁定第三方 MCP readOnlyHint 不降 low 展示（cli-core-a-2）。
      # 依赖上方 build-desktop-agent-cli.mjs 已产出 core/contracts dist 闭包。
      - name: CLI core vitest regressions (ToolCallStarted capability + MCP tool bridge)
        run: pnpm --dir apps/drora-cli/packages/core exec vitest run tests/tool-call-started-capability.test.ts tests/mcp-tool-bridge.test.ts
      - name: Obsidian plugin behavior tests (hook authorization semantics + stdin/stdout E2E)
        run: pnpm --dir apps/drora-cli/packages/obsidian-plugin run test
      - name: Official plugin hook runtime tests (manifest rewrite + hook host runner)
        # 上游迁移后 bootstrap:test 已改为 Vitest 全套；此专项继续执行原有 hook 原生入口。
        run: node --import tsx apps/drora-cli/packages/bootstrap/test/official-plugin-hook-runtime.test.mjs
      - name: CLI deep smoke (app-server handshake / subcommands / agent tools)
        run: node scripts/ci/cli-app-server-smoke.mjs apps/drora-cli/packages/cli/dist/drora.cjs
      - name: Upload CLI bundle
        uses: actions/upload-artifact@v4
        with:
          name: cli-drora-cjs
          path: apps/drora-cli/packages/cli/dist/drora.cjs
          retention-days: 7

  desktop-build:
    name: Desktop bundles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      # 桌面构建不消费 mock-cdn 跨平台 remote 资产(远端部署/WSL 链路专用),
      # 跳过以免在 CI 网络下下载 node tarball 挂死(release 链路同款配置)
      DRORA_SKIP_REMOTE_ASSETS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile && node -e "require('node:fs').accessSync('node_modules/bundle-require/node_modules/esbuild/lib/main.js')" || pnpm install --frozen-lockfile --force
      # 同 Typecheck job：本分支 typecheck 尾段的 bootstrap tsc 需要依赖闭包 dist 先在。
      - name: Build bootstrap dependency closure
        run: pnpm --dir apps/drora-cli exec turbo run build --filter=@drora/bootstrap^...
      - name: Emit workspace dists (tsc -b project references)
        # 明确各 runner 的编译堆资源；macOS 首次运行曾中止（exit 134），检查范围保持一致。
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck
      - name: Build CLI dependency closure (core/contracts dists)
        # 同上：turbo 布局问题，走有序闭包脚本（见 CLI bundle job 注释）。
        run: node scripts/build-desktop-agent-cli.mjs
      - name: Build plugin MCP runtimes (excluded seed packages)
        run: >-
          for pkg in browser-use-plugin android-emulator-plugin ios-simulator-plugin obsidian-plugin; do
          pnpm --dir "apps/drora-cli/packages/$pkg" run build || exit 1;
          done
        shell: bash
      - name: Build desktop production bundles
        run: pnpm --filter @drora/desktop run build
        timeout-minutes: 50
      - name: Verify desktop output segments
        shell: bash
        run: |
          set -e
          for seg in main host preload renderer scheduler; do
            test -d "packages/desktop/out/$seg" || { echo "missing out/$seg"; exit 1; }
          done
          test -f "packages/desktop/out/main/index.js"
          echo "desktop out/ segments complete"
      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktop-out-${{ matrix.os }}
          path: packages/desktop/out/
          retention-days: 7

  macos-helper:
    name: macOS helper .app build chain (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile && node -e "require('node:fs').accessSync('node_modules/bundle-require/node_modules/esbuild/lib/main.js')" || pnpm install --frozen-lockfile --force
      # 构建链守卫：addon 文件名、node 版本错配（modules 137 守卫）、SEA 熔丝、
      # ax_native 基线 SHA-256 钉扎——任一回归即红灯。
      - name: Build macOS helper .app
        run: pnpm --filter @drora/drora-cua-helper-runtime build:darwin-app
      - name: Provenance smoke
        run: >-
          'packages/zcode-cua-helper/dist-cua-helper/Drora Computer Use.app/Contents/MacOS/Drora Computer Use'
          --cua-helper-provenance-smoke
      - name: Native addon interface
        run: |
          node packages/zcode-cua-helper/tools/probe-ax-native.mjs 'packages/zcode-cua-helper/dist-cua-helper/Drora Computer Use.app/Contents/Resources/ax_native.node'
          node packages/zcode-cua-helper/tools/check-ax-native-interface.mjs 'packages/zcode-cua-helper/dist-cua-helper/Drora Computer Use.app/Contents/Resources/ax_native.node'
      # 离线段（A/B）：token 文件契约 + 原版参数序。E2E 段（C/F）需要产品
      # launcher 祖先与官方签名 staging 资产，仅本机可跑（parity-mac-helper、
      # embedded-build-id 同理，对照物不入库）。
      - name: Launch contract (offline sections)
        env:
          MAC_LAUNCH_CONTRACT_E2E: "0"
        run: node packages/zcode-cua/test/mac-launch-contract.mjs
      - name: Upload helper .app
        uses: actions/upload-artifact@v4
        with:
          name: helper-macos-app
          path: packages/zcode-cua-helper/dist-cua-helper/
          retention-days: 7

  addon-parity:
    name: Win32 addon rebuild + parity vs shipped binary (windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile && node -e "require('node:fs').accessSync('node_modules/bundle-require/node_modules/esbuild/lib/main.js')" || pnpm install --frozen-lockfile --force
        shell: cmd
      - name: Rebuild addon from restored source (MSVC + Windows SDK autodetect)
        run: node packages/zcode-cua-helper/native/reverse/build-rebuilt.mjs
        shell: cmd
      - name: Parity — read-only suite (57 checks)
        run: node packages/zcode-cua-helper/native/reverse/parity-native.mjs
        shell: cmd
        env:
          AX_NATIVE_ORIG: ${{ github.workspace }}\packages\zcode-cua-helper\build\Release\ax_native.node
      - name: Parity — input/output matrix (123 cells)
        run: node packages/zcode-cua-helper/native/reverse/parity-native-matrix.mjs
        shell: cmd
        env:
          AX_NATIVE_ORIG: ${{ github.workspace }}\packages\zcode-cua-helper\build\Release\ax_native.node
      - name: Rebuilt addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: ax-native-win-rebuilt
          path: packages/zcode-cua-helper/native/reverse/build/Release/ax_native_win.node
          retention-days: 7
