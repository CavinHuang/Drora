name: CLI SEA build

# 手动触发的发行级 CLI 构建:单可执行 SEA(内嵌 node 二进制 + 完整资产)。
# 常规 PR 不跑(需下载 node 发行二进制、postject 注入、staging 插件/TUI/
# runtime 工具资产,耗时数分钟)。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "SEA 目标(默认当前运行平台)"
        required: false
        default: ""
        type: string

jobs:
  sea:
    name: Single-executable build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build CLI bundle with dependency closure
        run: pnpm --filter @zcode/cli... build
      # SEA 还内嵌插件 MCP runtime(node_repl 宿主与工具插件),它们不在 cli 的
      # 依赖闭包内,按 SEA 资产清单单独构建
      - name: Build plugin MCP runtimes
        run: >-
          pnpm --filter @zcode/node-repl-host
          --filter @zcode/browser-use-plugin
          --filter @zcode/android-emulator-plugin
          --filter @zcode/ios-simulator-plugin build
      # SEA 资产解析要求 workspace 包(如 @zcode/shared)有 dist/index.js;
      # 根 typecheck 是 tsc -b(工程引用,带输出),即上游产出这些 dist 的链路
      - name: Emit workspace package dists (tsc -b project references)
        run: pnpm typecheck
      - name: Build single-executable (host target${{ github.event.inputs.target && format(' → {0}', github.event.inputs.target) || '' }})
        run: node scripts/build-sea.mjs ${{ github.event.inputs.target }}
        working-directory: apps/zcode-cli/packages/cli
        env:
          # SEA 下载 node 官方发行二进制;走 GH 网络无需镜像
          ELECTRON_GET_USE_PROXY: "0"
      - name: Locate SEA binary
        id: out
        shell: bash
        run: |
          set -e
          bin=$(ls apps/zcode-cli/packages/cli/dist/zcode-*x64* 2>/dev/null | grep -E '\.(exe)$|^.*zcode-(linux|macos|windows)-x64$' | head -1 || true)
          [ -n "$bin" ] || bin=$(find apps/zcode-cli/packages/cli/dist -maxdepth 1 -type f -name "zcode-*" ! -name "*.blob" ! -name "*.blob.*" | head -1 || true)
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "located: $bin"
      - name: Upload SEA artifacts
        if: steps.out.outputs.bin != ''
        uses: actions/upload-artifact@v4
        with:
          name: cli-sea-${{ matrix.os }}
          path: |
            ${{ steps.out.outputs.bin }}
            apps/zcode-cli/packages/cli/sea/**
          retention-days: 14
      - name: Smoke SEA binary (version)
        if: steps.out.outputs.bin != ''
        shell: bash
        run: |
          bin="${{ steps.out.outputs.bin }}"
          chmod +x "$bin" 2>/dev/null || true
          "$bin" --version
