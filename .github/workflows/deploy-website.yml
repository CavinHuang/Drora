name: Deploy website to GitHub Pages

# Drora 产品官网（apps/website 的 Next.js 静态导出，见 specs/website.md）CI + 部署：
#  - check：PR 与 main 推送 touching 官网输入时运行零依赖门禁
#    （scripts/check-website.mjs：site-src 片段的 /Drora 绝对内链、片段↔路由配对、
#    DOCS_SLUGS 清单一致性、i18n 键），坏链接不上线
#  - deploy：仅 main 推送与手动触发，先过 check，再 `pnpm --filter @drora/website build`
#    （build 先经 scripts/generate-hero-mock.mjs 烘焙 hero mock）产出静态导出目录
#    apps/website/out，跑 --out 产物探针后发布到 Pages（项目站点子路径 /Drora/）。
#    仓库设置中 Pages Source 需选择「GitHub Actions」（一次性配置，已配置）。
on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "packages/ui/**"
      - "packages/shared/**"
      - "scripts/check-website.mjs"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    paths:
      - "apps/website/**"
      - "packages/ui/**"
      - "packages/shared/**"
      - "scripts/check-website.mjs"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check website (links / routes / i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-website.mjs

  deploy:
    name: Deploy static site
    # PR 只做检查，绝不部署：Pages 环境只有一份，PR 预览会覆盖线上
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # concurrency 只约束部署（job 级），PR 的 check 不会打断进行中的发布
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        run: pnpm --filter @drora/website build
      - name: Probe static export
        run: node scripts/check-website.mjs --out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/out
      - id: deployment
        uses: actions/deploy-pages@v4
