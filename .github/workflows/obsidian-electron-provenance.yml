name: Obsidian Electron Provenance

# A real Electron/WebDriver smoke, separate from bundle/typecheck CI.
# Path-scoped to avoid imposing an expensive runner on unrelated PRs.
on:
  pull_request:
    paths:
      - ".github/workflows/obsidian-electron-provenance.yml"
      - "packages/desktop/test/e2e/conversation-session/manual-review/obsidian-inline-citation-provenance.test.ts"
      - "packages/desktop/test/e2e/obsidian-knowledge-positive.test.ts"
      - "packages/desktop/test/e2e/conversation-session/manual-review/obsidian-authenticated-handoff.test.ts"
      - "packages/desktop/test/e2e/fixtures/upstream/conversation-session/conversation-session-obsidian-authenticated-handoff.json"
      - "packages/ui/src/drora-extensions/WorkspaceMainView.tsx"
      - "packages/ui/src/app-shell/WorkspaceShellLayout.tsx"
      - "packages/ui/src/v4/vault/knowledge/useKnowledgeAgentActions.ts"
      - "apps/drora-cli/packages/bootstrap/src/drora-protocol-v4/product-projection.ts"
      - "apps/drora-cli/packages/bootstrap/src/drora-protocol-v4/commands/handlers/evidence-admission.ts"
      - "apps/drora-cli/packages/bootstrap/src/drora-protocol-v4/transcript-hydration.ts"
      - "apps/drora-cli/packages/bootstrap/test/evidence-session-wiring.test.mjs"
      - "packages/services/src/knowledge/**"
      - "packages/services/src/obsidian-vault/config.ts"
      - "packages/ui/src/v4/ConversationComposer.tsx"
      - "packages/ui/src/lib/conversationSelectionReference.ts"
      - "packages/ui/src/v4/ConversationTurnGroup.tsx"
      - "packages/ui/src/v4/vault/knowledge/KnowledgeAskInput.tsx"
      - "packages/ui/src/v4/vault/knowledge/KnowledgeAskResults.tsx"
      - "packages/ui/src/v4/vault/knowledge/KnowledgeCandidateCard.tsx"
      - "packages/desktop/test/e2e/fixtures/upstream/conversation-session/conversation-session-obsidian-inline-provenance.json"
      - "packages/ui/src/lib/knowledgeCitationMarkdown.ts"
      - "packages/ui/src/components/ai-elements/message.tsx"
      - "packages/ui/src/v4/VaultView.tsx"
      - "packages/services/src/node.ts"
      - "packages/services/src/knowledge/**"
      - "packages/services/src/obsidian-vault/**"
      - "apps/drora-cli/packages/core/src/permission/**"
      - "apps/drora-cli/packages/core/src/tool/executor/permission-*.ts"
  workflow_dispatch:

concurrency:
  group: obsidian-electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-provenance:
    name: Actual Electron forged source reject (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      E2E_PROVIDER_HTTP_MODE: replay
      # Manual-review specs require an explicit replay fixture; otherwise WDIO refuses to boot.
      E2E_PROVIDER_REPLAY_FIXTURE_PATH: ${{ github.workspace }}/packages/desktop/test/e2e/fixtures/upstream/conversation-session/conversation-session-obsidian-inline-provenance.json
      VITE_DRORA_E2E_STORE_BRIDGE: "1"
      DRORA_E2E_MANUAL_REVIEW: "1"
      DRORA_SKIP_REMOTE_ASSETS: "1"
      DRORA_E2E_SPEC: "./test/e2e/conversation-session/manual-review/obsidian-inline-citation-provenance.test.ts"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the UI/E2E reporting and CLI dependencies
        run: |
          pnpm --filter @drora/e2e-report build:node
          node scripts/build-desktop-agent-cli.mjs
      - name: Verify explicit replay fixture exists before launching Electron
        run: test -f "$E2E_PROVIDER_REPLAY_FIXTURE_PATH"
      - name: Verify actual Electron response and no forged citation navigation
        run: |
          xvfb-run -a pnpm --dir packages/desktop exec wdio run wdio.conf.ts \
            --spec ./test/e2e/conversation-session/manual-review/obsidian-inline-citation-provenance.test.ts
      - name: Upload Electron evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-electron-provenance-evidence
          path: |
            packages/desktop/.e2e-artifacts/
            packages/desktop/.e2e-network-capture/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  electron-positive-vault:
    name: Actual Electron managed Vault read-only positive (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      E2E_PROVIDER_HTTP_MODE: replay
      # Explicit local replay is a network safety guard, not a model-backed test.
      E2E_PROVIDER_REPLAY_FIXTURE_PATH: ${{ github.workspace }}/packages/desktop/test/e2e/fixtures/upstream/conversation-session/conversation-session-obsidian-inline-provenance.json
      VITE_DRORA_E2E_STORE_BRIDGE: "1"
      DRORA_E2E_MANUAL_REVIEW: "1"
      DRORA_SKIP_REMOTE_ASSETS: "1"
      DRORA_E2E_SPEC: "./test/e2e/obsidian-knowledge-positive.test.ts"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build UI/E2E reporting and CLI dependencies
        run: |
          pnpm --filter @drora/e2e-report build:node
          node scripts/build-desktop-agent-cli.mjs
      - name: Verify test sandbox prerequisites
        run: |
          test -f "$E2E_PROVIDER_REPLAY_FIXTURE_PATH"
          test -f packages/desktop/test/e2e/obsidian-knowledge-positive.test.ts
      - name: Verify real managed Vault indexing and Receipt Inspector
        run: |
          xvfb-run -a pnpm --dir packages/desktop exec wdio run wdio.conf.ts \
            --spec ./test/e2e/obsidian-knowledge-positive.test.ts
      - name: Upload real Vault Electron evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-electron-positive-vault-evidence
          path: |
            packages/desktop/.e2e-artifacts/
            packages/desktop/.e2e-network-capture/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  electron-authenticated-handoff:
    name: Actual Electron Agent evidence handoff and source navigation (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      E2E_PROVIDER_HTTP_MODE: replay
      E2E_PROVIDER_REPLAY_FIXTURE_PATH: ${{ github.workspace }}/packages/desktop/test/e2e/fixtures/upstream/conversation-session/conversation-session-obsidian-authenticated-handoff.json
      VITE_DRORA_E2E_STORE_BRIDGE: "1"
      DRORA_E2E_MANUAL_REVIEW: "1"
      DRORA_SKIP_REMOTE_ASSETS: "1"
      DRORA_E2E_SPEC: "./test/e2e/conversation-session/manual-review/obsidian-authenticated-handoff.test.ts"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build reporting and desktop Agent CLI
        run: |
          pnpm --filter @drora/e2e-report build:node
          node scripts/build-desktop-agent-cli.mjs
      - name: Verify direct and queued canonical evidence projections
        run: node --import tsx --test apps/drora-cli/packages/bootstrap/test/evidence-session-wiring.test.mjs
      - name: Check deterministic upstream replay fixture
        run: test -f "$E2E_PROVIDER_REPLAY_FIXTURE_PATH"
      - name: Exercise genuine Composer to CLI to Vault provenance
        run: |
          xvfb-run -a pnpm --dir packages/desktop exec wdio run wdio.conf.ts \
            --spec ./test/e2e/conversation-session/manual-review/obsidian-authenticated-handoff.test.ts
      - name: Upload live handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-electron-authenticated-handoff-evidence
          path: |
            packages/desktop/.e2e-artifacts/
            packages/desktop/.e2e-network-capture/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
