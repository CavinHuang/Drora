name: Release

# 完整发布流水线:双平台(macOS dmg/zip + Windows nsis exe)桌面安装包与
# CLI 单可执行,tag(v*)推送或手动触发;产物汇总为 GitHub Release。
#
# 产物形态:
#   - 正式(tag v*):ZCODE_ENV=production,安装包名无 _TEST 后缀,
#     Release 标记为 latest(非 prerelease),附 SHA256SUMS 与 latest.yml
#     (electron-builder 自动更新通道清单)。
#   - 手动 nightly:保留 _TEST 后缀与 prerelease 标记,便于区分。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      make_release:
        description: "构建后创建 GitHub Release(仅手动触发时生效)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder-os: mac
          - os: windows-2022
            builder-os: win
    runs-on: ${{ matrix.os }}
    env:
      # 桌面安装包不依赖 mock-cdn 的跨平台 remote 资产(node/pty 等,是远端部署
      # 与 WSL 链路用的;脚本注释明载 Windows build job 应跳过)。skip 后不再
      # 下载 node tarball —— 之前四跑 50 分钟超时全是这一步在 CI 网络下挂死。
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      # 正式发布用生产后端身份:安装包名不带 _TEST 后缀,应用连接生产环境。
      # 手动 nightly(dispatch 无 tag)保持 test 后缀以示区分。
      ZCODE_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'test' }}
    steps:
      - uses: actions/checkout@v4
      # 版本单一真相源:tag(v*)构建时把 tag 版本写入根 package.json,
      # desktop build-meta 与 electron-builder 都从这里取版本
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('version stamped:', p.version);
          "
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # SEA 资产解析与 node-repl-host 构建需要 workspace dist / 插件 runtime;
      # node-repl-host 还依赖 @zcode/core、@zcode/contracts 的 dist(在 cli 依赖
      # 闭包内),先构建闭包
      - name: Emit workspace dists (tsc -b project references)
        run: pnpm typecheck
      - name: Build CLI dependency closure (core/contracts dists)
        run: pnpm --filter @zcode/cli... build
      - name: Build plugin MCP runtimes
        # android/ios 插件被主 workspace 排除(seed 资产包),--filter 匹配不到,
        # 必须按包目录直入构建;node-repl-host/browser-use 同法保持一致
        run: >-
          for pkg in node-repl-host browser-use-plugin android-emulator-plugin ios-simulator-plugin; do
          pnpm --dir "apps/zcode-cli/packages/$pkg" run build || exit 1;
          done
        shell: bash
      # 桌面全链构建(含 agent bundle / native search / mac window bounds)
      - name: Build desktop production bundles
        run: pnpm --filter @zcode/desktop run build
        timeout-minutes: 50
      - name: Package desktop installer (electron-builder)
        run: node scripts/bundle.mjs --os=${{ matrix.builder-os }}
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          # 无签名证书环境:mac 侧 identity 归 null(未签名 dmg),win 侧跳过
          # authenticode;开源构建的预期形态
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ZCODE_ENABLE_MAC_SIGN: ""
      - name: Locate installers and channel files
        id: artifacts
        shell: bash
        run: |
          set -e
          dir="packages/desktop/release"
          [ -d "$dir" ] || dir="packages/desktop/dist"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          ls -la "$dir" || true
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.builder-os }}
          # 含 latest.yml/electron-builder 更新通道清单与 blockmap
          path: |
            ${{ steps.artifacts.outputs.dir }}/*.dmg
            ${{ steps.artifacts.outputs.dir }}/*.zip
            ${{ steps.artifacts.outputs.dir }}/*.exe
            ${{ steps.artifacts.outputs.dir }}/*.blockmap
            ${{ steps.artifacts.outputs.dir }}/latest*.yml
          if-no-files-found: error
          retention-days: 14

  cli-sea:
    name: CLI single-executable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('version stamped:', p.version);
          "
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Emit workspace dists
        run: pnpm typecheck
      - name: Build CLI bundle with dependency closure
        run: pnpm --filter @zcode/cli... build
      - name: Build plugin MCP runtimes
        # android/ios 插件被主 workspace 排除(seed 资产包),--filter 匹配不到,
        # 必须按包目录直入构建;node-repl-host/browser-use 同法保持一致
        run: >-
          for pkg in node-repl-host browser-use-plugin android-emulator-plugin ios-simulator-plugin; do
          pnpm --dir "apps/zcode-cli/packages/$pkg" run build || exit 1;
          done
        shell: bash
      - name: Build single-executable
        run: node scripts/build-sea.mjs
        working-directory: apps/zcode-cli/packages/cli
      - name: Locate SEA binary
        id: out
        shell: bash
        run: |
          set -e
          bin=$(find apps/zcode-cli/packages/cli/dist -maxdepth 1 -type f -name "zcode-*" ! -name "*.blob" ! -name "*.cjs*" ! -name "*.json" | head -1 || true)
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          chmod +x "$bin" 2>/dev/null || true
          "$bin" --version
      - name: Upload SEA binary
        if: steps.out.outputs.bin != ''
        uses: actions/upload-artifact@v4
        with:
          name: cli-sea-${{ matrix.os }}
          path: ${{ steps.out.outputs.bin }}
          retention-days: 14

  release:
    name: GitHub Release
    needs: [desktop, cli-sea]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.make_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List release contents
        run: find release-assets -type f -exec ls -la {} \;
      - name: Integrity check on downloaded assets
        # 离线校验下载好的资产:必备类别齐全 + SHA256SUMS 自洽(若随包携带)
        run: |
          cd release-assets
          fail=0
          for pat in "arm64.dmg" "arm64_TEST.dmg" ".zip" ".exe" "zcode-darwin" "zcode-linux" "zcode-windows" "SHA256SUMS.txt" "latest.yml" "latest-mac.yml"; do
            if ls | grep -qF "$pat"; then
              echo "PASS 资产含 $pat"
            else
              echo "FAIL 资产缺 $pat"; fail=1
            fi
          done
          if [ -f SHA256SUMS.txt ]; then
            python - <<'PY' || fail=1
          import hashlib, os, sys
          ok = True
          for line in open("SHA256SUMS.txt", encoding="utf-8"):
              line = line.rstrip("\n")
              if not line or line.startswith("SHA256SUMS"):
                  continue
              digest, name = line.split("  ", 1)
              match = next((c for c in (name, name.replace(" ", ".")) if os.path.exists(c)), None)
              if match is None:
                  print("MISS:", name); ok = False; continue
              h = hashlib.sha256(open(match, "rb").read()).hexdigest()
              if h != digest:
                  print("BAD:", match); ok = False
          sys.exit(0 if ok else 1)
          PY
          fi
          exit $fail
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..
          cat release-assets/SHA256SUMS.txt
      - name: Determine release flags
        id: flags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="nightly-${GITHUB_SHA::7}"
            git tag "$TAG" || true
            git push origin "$TAG" || true
          fi
          mapfile -t FILES < <(find release-assets -type f)
          for f in "${FILES[@]}"; do echo "asset: $f"; done
          FLAGS=""
          [ "${{ steps.flags.outputs.latest }}" = "true" ] && FLAGS="$FLAGS --latest"
          gh release create "$TAG" "${FILES[@]}" \
            --title "ZCode ${TAG#v}" \
            --notes "Automated multi-platform build.

          ## 桌面安装包(Desktop installers)
          macOS dmg/zip、Windows nsis exe。安装后从开始菜单/启动台启动图形界面。

          ## CLI 单可执行(zcode-<os>-<arch>)
          命令行工具,必须在终端里运行(双击会闪退 —— 它不是 GUI 程序):
          \`\`\`
          ./zcode-linux-x64 --help        # 查看全部命令
          ./zcode-linux-x64 tui           # 进入全屏终端界面
          ./zcode-linux-x64 -p "你的问题"  # 单条提问(需先 login)
          \`\`\`
          首次使用先执行 login 按提示完成浏览器授权;提问功能需要可用的
          模型服务凭据。

          ## 校验与更新
          - SHA256SUMS.txt: 所有产物的校验和
          - latest*.yml: electron-builder 自动更新通道清单

          未签名社区构建(macOS 未做 Gatekeeper 公证,Windows 无 Authenticode;
          首次运行请按系统提示放行)。Sources: commit ${GITHUB_SHA}" \
            $FLAGS --prerelease="${{ steps.flags.outputs.prerelease }}" || \
          gh release upload "$TAG" "${FILES[@]}" --clobber
