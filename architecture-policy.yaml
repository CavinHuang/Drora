global:
  # 临时时间戳（2026-09-10）：unmanaged-new-file 只约束此日期之后首次入库的文件。
  # 基于领先 staging 很多的分支开工时，merge-base 之前的"新增"文件不应被追溯。
  newFilesEnforcedSince: "2026-09-10"
  acceptedUpstreamCommits: []
  maxFileLines: 800
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true
  acceptedUpstreamSnapshot: scripts/architecture/upstream-snapshot.json

exceptions:
  - id: opensource-cua-test-project-config
    rule: unmanaged-new-file
    paths: [packages/zcode-cua/vitest.config.ts]
    reason: 该文件只装配测试项目，开源占位版本用于保持根单测入口可运行；不包含 producer 运行逻辑，不为同目录实现文件开放例外。
  - id: opensource-tool-search-comment-cleanup
    rule: unmanaged-new-file
    paths:
      - apps/drora-cli/packages/contracts/src/tools/tool-search.ts
      - apps/drora-cli/packages/core/src/tool/handlers/tool-search.ts
    reason: 已有上游文件仅去掉两行产品对标注释；去除注释后的 TypeScript 输出与 staging 完全一致。契约、实现和模块边界不变，整目录接管不在本次开源整理范围内；后续逻辑修改须重新核对模块治理。
  - id: project-location-cache-recovery-existing-edit
    rule: unmanaged-new-file
    paths:
      - packages/shared/src/project-access-token-client.ts
      - packages/services/src/model-provider/accountProjectTokenClient.ts
      - packages/services/src/credential/credentialService.ts
    reason: 已有项目 Token 与凭据存储增加派生缓存的局部恢复端口；保持原有 owner 和共享文件锁，不接管全目录。
  - id: test-ids-subpath-import-unmanaged-edit
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/browser-use/EmbeddedBrowserPermissionPrompts.tsx
      - packages/ui/src/hooks/useStartPlanRecommendation.ts
      - packages/ui/src/settings/DynamicWorkflowModeSetting.tsx
    reason: 已准入的存量文件只把 TID 导入从 @drora/shared 根入口改为 @drora/shared/test-ids 子路径（根入口不再导出 test-ids，以收窄受影响单测范围）；行为与模块边界不变，接管 ui 目录不在本次范围内。
  - id: connection-log-secret-token-unmanaged-edit
    rule: unmanaged-new-file
    paths: [packages/shared/src/source-server/connectionLog.ts]
    reason: 已存在的连接日志过滤函数只把已知秘密从子串替换改为完整 token 匹配，修复短密码反推泄露；签名与模块边界不变，接管整个 shared 包不在本次修复范围内。
  - id: connection-errors-econnreset-unmanaged-edit
    rule: unmanaged-new-file
    paths: [packages/shared/src/source-server/connectionErrors.ts]
    reason: 已存在的连接错误归一化码表补一项 ECONNRESET → remote-host-unreachable，修复在线断连恢复失败被误报为预检失败；签名与模块边界不变，接管整个 shared 包不在本次修复范围内。
  - id: client-config-public-field-unmanaged-edit
    rule: unmanaged-new-file
    paths: [packages/shared/src/clientConfig.ts]
    reason: Existing upstream public config parser gains one validated recommendation field; ownership and module boundaries remain unchanged, and adopting the shared package is outside this change.
  - id: highspeed-fallback-snapshot-unmanaged-edit
    rule: unmanaged-new-file
    paths: [apps/drora-cli/packages/core/src/runtime/methods/turn-execution-fallback.ts]
    reason: 合并已存在于 staging 的加速卡回退模块，仅将可变 Session 读取替换为本轮固定候选；保持现有 Core 模块边界，不在同步分支时机械拆分整个 runtime。
  - id: shortcut-settings-existing-ui-edit
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/components/ui/kbd.tsx
      - packages/ui/src/settings/ShortcutSearchBar.tsx
      - packages/ui/src/settings/ShortcutSettingsSection.tsx
    reason: Existing upstream shortcut components and keycap primitive edited for shared controls, responsive layout and save admission; adopting the entire settings directory requires a separate boundary refactor.
  - id: sidebar-workflow-tooltip-existing-ui-edit
    rule: unmanaged-new-file
    paths: [packages/ui/src/components/workflow-run-line/WorkflowRunRail.tsx]
    reason: Existing upstream workflow rail edited only to adapt native titles within the sidebar tooltip scope; workflow ownership and imports remain unchanged except for the shared UI tooltip adapter.
  - id: onboarding-existing-module-edit
    rule: unmanaged-new-file
    paths:
      - packages/services/src/onboarding/
      - packages/ui/src/onboarding/
    reason: onboarding 目录（记录持久化服务与触发 hook）是已合入 staging 的存量功能模块，本轮修复在其既有边界内收紧老用户判定与兜底；模块 adopt 登记需单独的边界梳理，不在本缺陷修复内展开。
  - id: remote-connection-flow-existing-size
    rule: max-file-lines
    paths: [packages/ui/src/remote-connection-flow/index.ts]
    reason: Preserve the existing single hook owner and closure; module adoption must not mechanically split state to satisfy line counts.
  - id: gen-ui-tweak-runtime-size
    rule: max-file-lines
    paths: [packages/desktop/src/renderer/src/plugin-sandbox/genUiTweakRuntime.js]
    reason: Keep parameter binding and registration lifecycle together; runtime-manifest.json and tests verify file integrity.
  - id: gen-ui-tweak-runtime-lint
    rule: disable-count
    paths: [packages/desktop/src/renderer/src/plugin-sandbox/genUiTweakRuntime.js]
    reason: Allow the control-character validation regex and the single-file parameter-control runtime.
  - id: team-panel-size
    rule: max-file-lines
    paths: [packages/ui/src/team/TeamPanel.tsx]
    reason: TeamPanel 是 team 的唯一显示面（状态头/动作区/任务板/成员卡/消息尾窗共享同一投影模型与命令上抛链）；2026-10-18 审查修复兑现设计 §3.3.2 全部承诺（attention 卡/头像点/依赖缩进/artifactRefs/尾窗）后超线，拆文件会割裂单一派生通道。
  - id: team-panel-lint
    rule: disable-count
    paths: [packages/ui/src/team/TeamPanel.tsx]
    reason: 上一条豁免的对应 lint disable（与 genUiTweakRuntime 同款成对登记）。
  - id: settings-machine-unmanaged-edit
    rule: unmanaged-new-file
    paths: [packages/ui/src/settings/SettingsMachine.tsx]
    reason: Admitted upstream file edited only to remove settings notices; adopting packages/ui/src/settings needs a separate module boundary refactor.
  - id: workflow-amend-provider-boundary-unmanaged-edit
    rule: unmanaged-new-file
    paths:
      - apps/drora-cli/packages/contracts/src/tools/amend-workflow.ts
      - apps/drora-cli/packages/core/src/tool/handlers/amend-workflow-resolve.ts
    reason: Admitted upstream files edited only to make an own-run AmendWorkflow that brings in a new provider ask the user; adopting the drora-cli contracts and core handlers needs a separate module boundary refactor.
  # agents-team 内核收口批次 2（spec §14 缺口8）：member-sink 是 spec §7/修订10 定稿的
  # 成员消息 presentation 承载（subagent_reply_steer 禁令渲染），与其余 team 内核文件
  # 同目录同边界——深依赖 core 运行时内部面（runtime/deps、runtime-task registry、
  # subagent 消息链），整目录 adopt 需单独的模块边界梳理（照 onboarding 同款理由）。
  - id: team-member-sink-unmanaged-new-file
    rule: unmanaged-new-file
    paths:
      - apps/drora-cli/packages/core/src/team/member-sink.ts
    reason: Agents-team kernel message sink mandated by specs/agents-team.md §7 (subagent_reply_steer injection); the core/src/team kernel shares one boundary and deeply imports core runtime internals, so adopting the directory as a managed module needs a separate boundary pass, not this gap-fix batch.
  - id: workflow-share-unmanaged-new-files
    rule: unmanaged-new-file
    paths:
      - packages/services/src/conversation-share/conversationShareInlineImages.ts
      - packages/services/src/conversation-share/conversationShareWorkflowSnapshot.ts
      - packages/shared/src/conversation-share-content.ts
      - packages/shared/src/conversation-share-tool-presentation.ts
      - packages/ui/src/v4/ConversationShareContent.tsx
      - packages/ui/src/v4/ConversationShareWorkflow.tsx
      - packages/ui/src/v4/conversationShareItems.ts
      - packages/ui/src/ToolCallBlocks/ToolPresentation.tsx
      - packages/ui/src/ToolCallBlocks/presentationCapabilities.tsx
      - packages/ui/src/ToolCallBlocks/renderers/list-models.tsx
      - packages/ui/src/ToolCallBlocks/renderers/list-saved-workflows-presentation.tsx
      - packages/ui/src/ToolCallBlocks/renderers/web-fetch.tsx
      - packages/ui/src/hooks/useToolPresentationHostCapabilities.ts
      - packages/ui/src/chat-input-toolbar/thoughtLevelLabels.ts
      - packages/ui/src/components/workflow-timeline/subagent-model-label.ts
      - packages/desktop/src/main/fileApplications.ts
    reason: Feature-branch files admitted path-exact; adopting conversation-share, tool presentation or renderer directories needs a separate module boundary refactor (same pattern as settings-machine-unmanaged-edit).
  - id: workflow-notifications-unmanaged-files
    rule: unmanaged-new-file
    paths:
      - apps/drora-cli/packages/core/src/runtime-task/workflow-blocked-reminder.ts
      - apps/drora-cli/packages/core/src/runtime/methods/dynamic-workflow-blocked-reminder.ts
      - apps/drora-cli/packages/core/src/runtime-task/workflow-notification-copy.ts
      - apps/drora-cli/packages/core/src/runtime/methods/dynamic-workflow-run-hole-notification.ts
      - apps/drora-cli/packages/core/src/tool/handlers/model-reference.ts
      - packages/shared/src/test-ids-workflow.ts
    reason: Workflow reminder, notification and model reference files reached staging without the MR architecture gate running; adopting the drora-cli core and shared test ids needs a separate module boundary refactor.
  - id: composer-toolbar-unmanaged-files
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/ControlShortcutBadge.tsx
      - packages/ui/src/chat-input-toolbar/ComposerEffortHeading.tsx
      - packages/ui/src/chat-input-toolbar/ComposerModelMenu.tsx
      - packages/ui/src/chat-input-toolbar/ComposerProviderMenu.tsx
      - packages/ui/src/chat-input-toolbar/ComposerTriggerTransition.tsx
      - packages/ui/src/hooks/useComposerConnectionSwitch.ts
      - packages/ui/src/lib/composerPlanGroups.ts
      - packages/ui/src/lib/providerFamilyConnectionTransition.ts
      - packages/ui/src/prompt-editor/useComposerToolbarFit.ts
    reason: Composer model, provider and toolbar files reached staging without the MR architecture gate running; adopting the packages/ui composer toolbar needs a separate module boundary refactor.
  - id: provider-endpoint-routing-unmanaged-edit
    rule: unmanaged-new-file
    paths:
      - apps/drora-cli/packages/adapters/src/model/endpoint-routing-edition/index.ts
      - apps/drora-cli/packages/adapters/src/model/provider-endpoint-routing-options.ts
    reason: Existing upstream routing assembly files gain the endpoint origin and injected JWT reader; adopting the full CLI model adapter directory needs a separate module boundary refactor.
  - id: voice-session-store-spec-frozen-location
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/store/voiceSessionStore.ts
    reason: 语音两条腿状态机（specs/voice-agent-integration.md §3.1/§3.2）；spec 冻结落位 store/ 目录（照 composerAttachmentUploadStore 先例，不做 feature-colocation 豁免），整目录接管 store/ 存量不在本批范围；播报腿唯一写路径经 ui/voice 的 AnnouncementLegControl 受控面进入，状态所有者不变。
  - id: voice-section-settings-unmanaged-dir
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/settings/VoiceSection.tsx
    reason: 语音设置分节（specs/voice-agent-integration.md §6.1/§6.2/§9.2）；只经 useSettings 读写 appSettings 语音八键与复用 SettingsGroupCard/SettingsRow，不建立新模块边界；settings/ 目录整目录接管不在本批范围（照 shortcut-settings-existing-ui-edit 先例）。
  - id: composer-text-append-unmanaged-dir
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/v4/composer/composerTextAppend.ts
    reason: composerTextInsertRequest mode="append" 的确定性拼接纯函数（§2.4），唯一消费方是同 unmanaged 聚合的 ConversationComposer 应用分支，无跨模块边界；v4/ 整目录接管不在本批范围。
  - id: voice-announcement-preferences-unmanaged-dir
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/lib/voiceAnnouncementPreferences.ts
    reason: 播报偏好 reader 收口（specs/voice-agent-integration.md §9.3，照 taskNotificationPreferences.ts:33 先例落在 lib/）；纯函数委托 ui/voice 的 reader，无新模块边界；lib/ 目录整目录接管不在本批范围。
  - id: voice-mic-permission-policy-unmanaged-dir
    rule: unmanaged-new-file
    paths:
      - packages/desktop/src/main/voicePermissionPolicy.ts
    reason: 语音听写 mic 权限双 handler 显式登记（specs/voice-agent-integration.md §9.2 / TV-5 方案：audio 允许、含 video 拒绝、其余保持缺省现状）；照 embeddedBrowserPermissionPolicy 模式的独立单文件策略，不改变既有 desktop main 模块边界；main/ 整目录接管不在本批范围。
  - id: composer-escape-plan-unmanaged-dir
    rule: unmanaged-new-file
    paths:
      - packages/ui/src/prompt-editor/composerEscapePlan.ts
    reason: composer Esc 仲裁顺序纯函数（§4.4 键位仲裁表；mention/录音/取消优先级单测钉住）；唯一消费方是同 unmanaged 聚合的 ChatPromptEditor，无新模块边界；prompt-editor/ 整目录接管不在本批范围。
