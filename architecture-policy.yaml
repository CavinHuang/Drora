      - apps/drora-cli/packages/core/src/tool/handlers/list-models.ts
      - apps/drora-cli/packages/core/src/tool/handlers/fill-workflow-hole.ts
      - apps/drora-cli/packages/core/src/tool/workflow-entrypoints/contract.ts
    layers: { app: . }
    owner: agent

  - id: tool-result-settlement
    roots:
      - apps/drora-cli/packages/core/src/runtime/tool-result-settlement
      - apps/drora-cli/packages/core/src/runtime/methods/tool-result-settlement.ts
      - apps/drora-cli/packages/core/tests/tool-result-settlement
    managed: true
    requires: [drora-cli]
    publicEntrypoints:
      - apps/drora-cli/packages/core/src/runtime/methods/tool-result-settlement.ts
      - apps/drora-cli/packages/core/src/runtime/tool-result-settlement/contract.ts
    layers: { app: . }
    owner: agent
  - id: channel-reply-tool
    roots:
      - apps/drora-cli/packages/core/src/tool/channel-reply
      - apps/drora-cli/packages/core/src/tool/handlers/reply-to-channel.ts
      - apps/drora-cli/packages/core/tests/channel-reply
    managed: true
    requires: [shared, drora-cli]
    publicEntrypoints:
      - apps/drora-cli/packages/core/src/tool/handlers/reply-to-channel.ts
      - apps/drora-cli/packages/core/src/tool/channel-reply/contract.ts
    layers: { app: . }
    owner: agent

  # composer-toolbar-layout：登记既有 DOM 布局入口，不改调用路径。
  - id: composer-toolbar-layout
