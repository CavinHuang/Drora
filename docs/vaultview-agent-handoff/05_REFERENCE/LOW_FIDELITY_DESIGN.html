function stageStatus(i){if(state.phase==='idle')return i===0?'未执行':'待执行';if(state.phase==='searching')return i<2?'执行中':'待执行';if(i===2&&!hasJev())return state.jev?'已降级':'跳过（本地）';if(i===5&&inferredIntent()==='find')return '无需执行';if(state.scenario==='weak'&&i===3)return '扩大一次后仍不确定';if(state.scenario==='none'&&i===3)return '证据不足';if(state.scenario==='stale'&&i===4)return '来源已变化';return '完成';}

n><option value="ambiguous" ${state.scenario==='ambiguous'?'selected':''}>多个近似候选</option><option value="weak" ${state.scenario==='weak'?'selected':''}>证据不足 / 扩搜</option><option value="none" ${state.scenario==='none'?'selected':''}>无可靠文章</option><option value="partial" ${state.scenario==='partial'?'selected':''}>索引覆盖不完整</option><option value="timeout" ${state.scenario==='timeout'?'selected':''}>Jev 超时</option><option value="stale" ${state.scenario==='stale'?'selected':''}>来源版本过期</option><option value="modeloff" ${state.scenario==='modeloff'?'selected':''}>生成模型不可用</option></select>${btn(state.dark?'浅色':'深色','theme','small')}${btn(state.wire?'高保真':'线稿','wire','small')}<span class="spacer"></span><span>非真实 Vault / Jev 数据</span></div></section></div>`}
function content(){if(state.tab==='notes')return notesView();if(state.tab==='insights')return insightsView();if(state.tab==='review')return reviewView();return searchView()}
function searchView(){const intent=inferredIntent(),docs=sortedDocs();let status=state.scenario==='weak'?'第一轮没有直接证据，已尝试一次有限扩搜；以下文章可能相关，但尚不能确认目标。':state.scenario==='none'?'没有找到能核验的目标文章。可以换一种描述，或检查索引覆盖范围。':state.scenario==='ambiguous'?'有多篇文章符合部分线索，建议先查看原文差异。':state.scenario==='partial'?'当前只索引了部分笔记。本次结果不代表整个 Vault 的完整情况。':state.scenario==='stale'?'部分来源已更新，点击前需要重新核验。':state.scenario==='timeout'&&state.jev?'Jev 重排未完成，已保留本地排序和候选。':'', isWarn=!!status;return `<div class="split"><main class="main"><div class="smallcaps">PERSONAL KNOWLEDGE · ASK VAULT</div><h1 class="headline">用一句话，找回你收藏过的内容</h1><p class="subtext">不需要记得文章标题。可以描述观点、场景、原话或你想解决的问题。</p><div class="querybox"><textarea id="query" aria-label="自然语言检索" placeholder="例如：我之前收藏过一篇说长上下文无法替代长期记忆的文章…">${esc(state.query)}</textarea><div class="queryfooter"><div class="toggle">${[['auto','自动识别'],['find','找文章'],['answer','问内容'],['compare','比较']].map(([k,v])=>`<button type="button" data-act="intent-${k}" class="${state.intent===k?'active':''}">${v}</button>`).join('')}</div><span class="spacer"></span>${btn('↵ 开始查找','submit','primary')}</div></div><div class="suggestions">${EXAMPLES.map((e,i)=>`<button class="suggestion" data-act="example-${i}">${i===0?'找一篇收藏':i===1?'根据笔记回答':'对比不同观点'} ↗</button>`).join('')}</div><div class="hrow" style="margin-top:16px;flex-wrap:wrap"><span class="tag">来源：当前 Vault</span><span class="tag">本地召回：全文${state.scenario==='partial'?'（部分）':''} + 语义（如可用）</span><button class="btn small ${state.jev?'sel':''}" data-act="toggle-jev">${state.jev?'✓ Jev 辅助决策':'◇ 仅本地决策'}</button>${state.jev?btn('查看决策过程','trace','small'):''}<span class="spacer"></span><span class="subtext">不显示虚构的准确率</span></div>${status?`<div class="notice ${isWarn?'warning':''}" role="status">${esc(status)} ${state.scenario==='none'?btn('换一种说法','new-query','small'):''}${state.scenario==='timeout'?btn('重试增强','retry-jev','small'):''}</div>`:''}${state.phase==='searching'?'<div class="skeleton">◌ 正在分析线索和召回相关笔记……</div>':state.phase==='idle'?'<div class="skeleton">请输入你记得的线索，然后开始查找。</div>':`<div class="blockhead"><strong>${intent==='answer'?'有来源的回答':intent==='compare'?'跨文章观点对照':'找到的文章候选'}</strong><span class="tag">${intent==='find'?'找文章':intent==='answer'?'问内容':'比较'}</span><span class="spacer"></span><span class="subtext">${docs.length} 篇候选 · ${hasJev()?'Jev 辅助排序':'本地排序'}</span></div>${intent==='answer'?answerView(docs):intent==='compare'?comparisonView(docs):''}${docs.length?docs.map((d,i)=>resultCard(d,i)).join(''):`<div class="notice">没有直接证据可供引用。我们不会自动编造文章标题或给出无依据的结论。</div>`}<div class="hrow" style="margin:15px 0;flex-wrap:wrap">${btn('换一种说法再找','new-query','small')}${docs.length?btn('用这些资料回答','action-answer','small'):''}${docs.length>1?btn('比较这些文章','action-compare','small'):''}${btn('查看检索诊断','trace','small')}</div>`}</main>${inspectorView()}</div>`}
function resultCard(d,i){let stale=state.scenario==='stale'&&i===0;return `<article class="card result ${state.selected===d.id?'selected':''}" data-select="${d.id}" tabindex="0"><div class="hrow"><h3 style="margin:0">▤ ${esc(d.title)}</h3><span class="spacer"></span><span class="tag ${stale?'warn':''}">${stale?'需核验':'候选 '+(i+1)}</span></div><div class="path">${esc(d.file)}</div><div class="excerpt">${mark(esc(d.excerpt))}</div><div class="hrow" style="flex-wrap:wrap"><span class="tag ${d.id==='m1'?'ok':''}">${hasJev()?esc(d.level):'原始召回'}</span><span class="reason">${esc(hasJev()?d.why:'来自标题、正文或相关概念')}</span></div><div class="cardfooter"><span class="subtext">${esc(d.heading)} · ${d.clip?'收藏于 '+d.clip:'收藏日期未知'}</span><span class="spacer"></span><button type="button" class="link" data-act="open-${d.id}">打开原文 ↗</button><button type="button" class="link" data-act="use-${d.id}">带入对话 +</button></div></article>`}
function mark(t){return t.replace(/长期记忆|上下文窗口|持续更新|版本管理|可靠遗忘|Token/gu,s=>'<mark>'+s+'</mark>')}
function answerView(docs){if(state.scenario==='none'||state.scenario==='weak')return '<div class="notice warning">当前没有足够的直接来源支持完整回答。可先阅读这些候选，再补充线索。</div>';if(state.scenario==='modeloff')return '<div class="notice warning">资料已找到，但当前生成模型不可用。仍可点击原文和引用；稍后再生成总结。</div>';return `<div class="answer"><div class="hrow"><b>基于收藏文章的整理（模拟）</b><span class="spacer"></span><span class="tag ${state.answerValidated?'ok':'warn'}">${state.answerValidated?'引用待来源确认':'部分主张支持性不足'}</span></div><p>这些笔记普遍把“当前推理上下文”与“持久记忆”区别对待：前者负责本轮任务，后者需要更新、追溯与遗忘机制。<button class="ansref" data-act="focus-m1">[1]</button></p><p>在实现上，一篇技术笔记建议分层管理工作上下文和长期记忆；另有一篇强调历史信息应保留核验时间和衰减条件。<button class="ansref" data-act="focus-m2">[2]</button><button class="ansref" data-act="focus-m4">[3]</button></p><div class="subtext">引用的最终状态取决于当前文件版本与逐项语义支持性校验；示例并非真实模型生成。</div></div>`}
function comparisonView(docs){if(docs.length<2)return '<div class="notice warning">目前不足两篇可比较的资料，请调整检索条件。</div>';return `<div class="comparegrid"><div class="compcell heading">比较维度</div><div class="compcell heading">分层记忆方案</div><div class="compcell heading">可靠遗忘方案</div><div class="compcell">主要关注</div><div class="compcell">短期工作信息与长期持久记忆分层 <button class="ansref" data-act="focus-m2">[A]</button></div><div class="compcell">知识更新、来源回溯和遗忘策略 <button class="ansref" data-act="focus-m4">[B]</button></div><div class="compcell">工作机制</div><div class="compcell">筛选进入长期记忆的内容</div><div class="compcell">为旧信息保留最后核验时间</div><div class="compcell">对外部模型出站</div><div class="compcell subtle">原文未提及</div><div class="compcell subtle">原文未提及</div></div><p class="subtext" style="margin:10px 0">“未提及”不代表“反对”；比较内容由两篇各自引用约束。</p>`}
function inspectorView(){let doc=DOCS.find(x=>x.id===state.selected)||DOCS[0];const trace=state.trace||state.inspector==='trace';return `<aside class="inspect"><div class="insheader"><b>${trace?'检索与决策过程':'来源核验'}</b><button class="btn quiet small" data-act="trace">${trace?'查看原文':'过程详情'}</button></div><p class="subtext">${trace?'查看每个阶段如何影响下一步，不展示原始用户敏感内容。':'选择文章后查看命中片段及当前来源状态。'}</p>${trace?tracePanel():`<div class="insbox"><b style="font-size:12px">${esc(doc.title)}</b><div class="path">${esc(doc.file)}</div><div class="inslabel">命中章节</div><div class="insbody">${esc(doc.heading)}</div><div class="inslabel">内容类别</div><div class="insbody">${esc(doc.meta)}</div></div><div class="inslabel">命中原文 · 片段</div><div class="quote">${esc(doc.quote)}</div><div class="hrow" style="flex-wrap:wrap">${btn('在 Vault 中打开','open-'+doc.id,'primary small')}${btn('带入 Agent','use-'+doc.id,'small')}</div><div class="inslabel">来源有效性</div><div class="insbody">${state.scenario==='stale'?'<span style="color:var(--warning)">◌ 文件版本已变化，请重新定位</span>':'<span style="color:var(--success)">● 原型模拟：来源可验证</span>'}</div><div class="inslabel">收藏日期</div><div class="insbody">${doc.clip||'原笔记未提供字段，不能用修改时间代替'}</div><div class="inslabel">排序与引用说明</div><div class="insbox insbody">${hasJev()?'Jev 已对候选观点匹配提供辅助判断。':'本地检索结果；尚未调用远端 Jev。'}<br>真正可信的原文链接必须通过源文件版本、权限及锚点校验。</div>`}</aside>`}
function tracePanel(){return `<div class="insbox"><b style="font-size:12px">本次查询决策记录</b><div class="insbody subtle">意图：${inferredIntent()} · sourceEpoch：${state.sourceEpoch} · Query #${state.searchNum}</div><div class="insbody subtle">Jev：${hasJev()?'已使用（模拟）':state.jev?'未完成/已降级':'关闭'} · 仅本次授权：${state.consent?'是':'否'}</div></div><div class="trace">${STAGES.map((s,i)=>`<div class="traceitem ${stageStatus(i).includes('不足')||stageStatus(i).includes('过期')?'warn':''}"><b>${i+1}. ${s[0]} <span class="tag" style="margin-left:5px">${stageStatus(i)}</span></b><div>${s[1]}</div></div>`).join('')}</div><div class="notice">所有阶段只提供业务决策信号。权限、日期范围、文件 SHA 和写盘审批始终由代码强制检查。</div>`}
function notesView(){let doc=DOCS.find(x=>x.id===state.selected)||DOCS[0];return `<div class="docview"><aside class="tree"><b style="font-size:12px">◫ Personal Vault</b><div class="divider"></div>${DOCS.map(d=>`<button class="treeitem ${state.selected===d.id?'sel':''}" data-act="note-${d.id}">▤ ${esc(d.title)}</button>`).join('')}</aside><main class="editor"><div class="smallcaps">MARKDOWN · LIVE EDITOR (MOCK)</div><h1>${esc(doc.title)}</h1><p class="subtext">${esc(doc.file)} · ${doc.clip?'收藏于 '+doc.clip:'收藏日期未知'}</p><div class="divider"></div><h2>${esc(doc.heading)}</h2><p>${esc(doc.excerpt)}</p><p>这份资料保留为原始 Markdown，由 Obsidian Vault 持有；Drora 不迁移或复制笔记内容到另一个事实源。</p><div class="hrow" style="margin-top:24px;flex-wrap:wrap">${btn('以当前文章问库','ask-selected','primary')}${btn('为 Agent 引用','use-'+doc.id)}${btn('提出知识修改','create-proposal')}</div><div class="notice">本原型未实现真实 Markdown 保存。真实产品继续复用现有 VaultView / LiveMarkdownEditor。</div></main><aside class="asideinfo"><div class="smallcaps">RELATED</div><h3>相关笔记</h3><p class="subtext">根据标题、正文和已验证的知识联系推荐；不会自动修改原文。</p>${DOCS.filter(d=>d.id!==doc.id).slice(0,3).map(d=>`<button class="listitem" data-act="note-${d.id}"><b>${esc(d.title)}</b><div class="path">${esc(d.heading)}</div></button>`).join('')}</aside></div>`}
function insightsView(){return `<div class="other"><div class="smallcaps">KNOWLEDGE INSIGHTS</div><h1 class="headline">发现值得重新看的内容</h1><p class="subtext">只提醒有具体原文支持的关联或差异。默认不打断工作。</p><div class="card" style="max-width:780px"><div class="insightcard"><div class="brandicon">≍</div><div><div class="hrow"><b>两份关于长期记忆的笔记关注点不同</b><span class="tag">值得比较</span></div><p class="subtext">「分层记忆方案」强调记忆分类和保存；「可靠遗忘方案」强调时效与持续核验。两者不必然冲突。</p><div class="chips"><span class="chip">分层记忆方案.md</span><span class="chip">可靠遗忘.md</span></div><div class="hrow" style="margin-top:15px">${btn('查看原文并比较','insight-compare','primary small')}${btn('不再提示','dismiss-insight','small')}</div></div></div></div><div class="card" style="max-width:780px"><b>一条旧结论可能需要复核</b><p class="subtext">原文最后核验时间较早；此处只提供建议，不自动替换历史结论。</p>${btn('查看依据','inspect-old','small')}</div></div>`}
function reviewView(){return `<div class="other"><div class="smallcaps">KNOWLEDGE REVIEW</div><h1 class="headline">知识修改审核</h1><p class="subtext">L2 知识沉淀必须审阅来源和 Diff 后才能写回。普通 Agent 执行仍沿用 Drora 的权限体系。</p><div class="twocol"><div><button class="listitem ${state.selectedProposal==='p1'?'active':''}" data-act="proposal-p1"><b>完善长期记忆设计笔记</b><div class="subtext">知识候选 · ${state.proposalState==='applied'?'已应用':state.proposalState==='rejected'?'已拒绝':'待审核'}</div></button><button class="listitem ${state.selectedProposal==='p2'?'active':''}" data-act="proposal-p2"><b>更新个人知识索引指南</b><div class="subtext">知识候选 · 待审核</div></button></div><div class="card" style="margin:0"><div class="hrow"><b>${state.selectedProposal==='p1'?'完善长期记忆设计笔记':'更新个人知识索引指南'}</b><span class="spacer"></span><span class="tag warn">${state.proposalState==='applied'?'已应用':'需人工审核 · L2'}</span></div><p class="subtext">目标文件：项目/Agent/分层记忆方案.md · 包含来自两篇资料的出处 · proposalRevision=2</p><div class="diffgrid"><div><div class="inslabel">修改前</div><div class="diff"><span>## 长期记忆</span><span class="del">- 将重要消息直接写入记忆。</span><span>保留执行上下文。</span></div></div><div><div class="inslabel">修改后</div><div class="diff"><span>## 长期记忆</span><span class="add">+ 经审核后记录长期有效的知识与来源。</span><span class="add">+ 为每条记忆保留版本与最后核验时间。</span></div></div></div><div class="inslabel">修改依据</div><div class="chips"><span class="chip">为什么长上下文不等于记忆</span><span class="chip">可靠遗忘与知识更新</span></div><div class="divider"></div><div class="hrow" style="flex-wrap:wrap">${btn('拒绝','reject','small danger')}${btn('检查文件版本','check-file','small')}${btn(state.proposalState==='applied'?'查看已应用状态':'批准并应用','approve','primary small')}${state.proposalState==='applied'?btn('撤销修改','undo','small'):''}</div><div class="subtext" style="margin-top:10px">演示按钮不会修改任何真实文件；正式执行必须有 CAS 检查、操作账本与事故恢复。</div></div></div></div>`}
function settingsView(){return `<div class="drawerwrap" data-act="close-drawer"><section class="drawer" role="dialog" aria-modal="true" aria-label="Vault 设置"><div class="hrow"><div><div class="smallcaps">SOURCE / PRIVACY / INDEX</div><h2 style="margin:6px 0">Vault 设置</h2></div><span class="spacer"></span>${btn('×','close-drawer','small quiet')}</div><p class="subtext">所有 Obsidian 专属配置集中在 VaultView；不增加独立 Knowledge 设置一级导航。</p><div class="settingitem"><div><b>活动 Vault</b><p>Personal Vault · 单活动来源 · sourceEpoch ${state.sourceEpoch}</p></div><span class="tag ok">已连接</span></div><div class="settingitem"><div><b>索引健康</b><p>${state.scenario==='partial'?'部分文档尚未建立索引':'文件与片段索引已更新（模拟）'}。索引是可重建缓存，不是原文事实源。</p></div>${btn('查看详情','status','small')}</div><div class="settingitem"><div><b>混合语义召回</b><p>本地优先；远端 Embedding 另设单独授权。未配置时降级词法检索。</p></div><span class="tag">本地</span></div><div class="settingitem"><div><b>Jev 决策辅助</b><p>默认关闭；仅对本次查询和必要候选片段授予外发权。不包含绝对路径或其它会话。</p></div><button class="switch ${state.jev?'on':''}" aria-label="切换 Jev" data-act="toggle-jev"><i></i></button></div><div class="settingitem"><div><b>风险分级审核</b><p>L0 只读 · L1 常规小范围编辑 · L2 人工审核 · L3 强限制。</p></div><span class="tag ok">方案 C</span></div><div class="settingitem"><div><b>清理索引</b><p>仅清除可重建索引，不删除原文、Proposal、审核账本或备份。</p></div>${btn('模拟重建','reindex','small')}</div><div class="divider"></div><div class="notice">本页仅为产品设计原型：真实授权、提供商配置、索引任务和 Agent 写操作均未连接。</div></section></div>`}
function modalView(){if(!state.modal)return'';let title='',body='',actions='';if(state.modal==='consent'){title='允许 Jev 辅助判断本次查询？';body='<p>Jev 需要看到本次自然语言问题及召回的少量原文片段，才能判断哪个候选真正符合你的描述。</p><div class="insbox"><b>本次出站范围</b><p>• 当前查询文本（可能包含个人信息）<br>• 最多 20 条候选片段（每条有长度限制）<br>• 标题和小节标题；不包含绝对路径、API key 或其他会话历史</p></div><p>仅本次授权，不会默认给其它模型或下一次查询授权。拒绝后仍可完整使用本地检索。</p>';actions=btn('保持本地','deny-jev')+btn('仅本次允许（模拟）','allow-jev','primary')}else if(state.modal==='source'){const doc=DOCS.find(x=>x.id===state.selected)||DOCS[0];title='打开原文定位 · 交互模拟';body=`<div class="insbox"><b>${esc(doc.title)}</b><div class="path">${esc(doc.file)}</div><div class="inslabel">定位章节</div><div class="insbody">${esc(doc.heading)}</div></div><p>${esc(doc.excerpt)}</p><div class="notice">正式产品必须在打开前读取用户已授权的 Markdown，比较 sourceEpoch / SHA 并重新定位原文；当前只展示模拟文章。</div>`;actions=btn('关闭','close-modal','primary')}else if(state.modal==='stale'){title='原文已发生变化';body='<p>该候选对应的文件版本与检索时不同。旧的段落位置不能直接作为可信引用使用。</p><div class="notice warning">请重新核验并定位当前文件中的匹配段落。若未找到，则移除“已验证”标签。</div>';actions=btn('稍后处理','close-modal')+btn('模拟重新核验','verify-source','primary')}else if(state.modal==='used'){title='加入当前 Drora Agent 会话';body='<p>将当前经过验证的文章及引用 Receipt 带入同一个 Drora Session，供用户继续询问或比较，不创建第二套 Agent 会话。</p><div class="notice">生产环境需先完成 session scoped Evidence Receipt 和真实的提交边界验证。</div>';actions=btn('取消','close-modal')+btn('模拟加入','close-modal','primary')}else if(state.modal==='conflict'){title='文件版本冲突';body='<p>原文在审核期间发生变化，旧的批准已失效。本次修改不会覆盖新内容。</p><div class="notice warning">需要重新读取文件、重算 Diff，再请用户批准新版本。</div>';actions=btn('关闭','close-modal')+btn('返回待审核','reset-proposal','primary')}else{title='设计说明';body='<p>该入口属于 Drora 已有工作台能力，本原型只验证 VaultView 领域的页面与交互。</p>';actions=btn('关闭','close-modal','primary')}return `<div class="modalwrap" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><h3>${title}</h3><div class="insbody">${body}</div><div class="actions">${actions}</div></div></div>`}
function render(){document.body.className=(state.dark?'dark ':'')+(state.wire?'wire':'');document.getElementById('app').innerHTML=`<div class="app">${topbar()}</div>${state.settings?settingsView():''}${modalView()}`;let t=document.getElementById('query');if(t)t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();triggerSearch()}});const sel=document.getElementById('scenario');if(sel)sel.onchange=e=>{state.scenario=e.target.value;state.phase='ready';state.reranked=state.jev&&state.consent&&state.scenario!=='timeout';state.selected=(sortedDocs()[0]||DOCS[0]).id;render()}}
function triggerSearch(){let q=document.getElementById('query');if(q)state.query=q.value.trim()||state.query;state.searchNum++;state.phase='ready';state.usedExpansion=state.scenario==='weak';state.reranked=state.jev&&state.consent&&state.scenario!=='timeout';state.selected=(sortedDocs()[0]||DOCS[0]).id;state.trace=false;render()}
document.addEventListener('click',e=>{const select=e.target.closest('[data-select]');if(select&&!e.target.closest('[data-act]')){state.selected=select.dataset.select;render();return}const x=e.target.closest('[data-act]');if(!x)return;const a=x.dataset.act;
if(a==='close-modal' && e.target.closest('.modal') && x===e.target.closest('.modalwrap'))return;
if(a==='close-drawer' && e.target.closest('.drawer') && x===e.target.closest('.drawerwrap'))return;
if(a.startsWith('tab-')){state.tab=a.slice(4);render();return}if(a.startsWith('intent-')){state.intent=a.slice(7);render();return}if(a.startsWith('example-')){const t=EXAMPLES[+a.slice(8)];state.query=t[0];state.intent=t[1];state.scenario='hit';triggerSearch();return}if(a==='submit'){triggerSearch();return}
if(a==='toggle-jev'){if(state.jev){state.jev=false;state.consent=false;state.reranked=false;render()}else{state.modal='consent';render()}return}if(a==='allow-jev'){state.modal='';state.jev=true;state.consent=true;state.reranked=state.scenario!=='timeout';state.settings=false;render();return}if(a==='deny-jev'){state.modal='';state.jev=false;state.consent=false;state.reranked=false;render();return}if(a==='retry-jev'){state.scenario='hit';state.jev=true;state.reranked=state.consent;render();return}if(a==='trace'){state.trace=!state.trace;render();return}
if(a==='theme'){state.dark=!state.dark;render();return}if(a==='wire'){state.wire=!state.wire;render();return}if(a==='settings'){state.settings=true;render();return}if(a==='status'){state.settings=true;render();return}if(a==='close-drawer'){state.settings=false;render();return}if(a==='close-modal'){state.modal='';render();return}if(a==='reindex'){state.scenario='hit';state.sourceEpoch++;state.settings=false;state.modal='';state.phase='idle';render();return}
if(a.startsWith('note-')){state.selected=a.slice(5);render();return}if(a.startsWith('focus-')){state.selected=a.slice(6);state.trace=false;render();return}if(a.startsWith('open-')){state.selected=a.slice(5);state.modal=state.scenario==='stale'?'stale':'source';render();return}if(a.startsWith('use-')){state.selected=a.slice(4);state.modal='used';render();return}if(a==='verify-source'){state.scenario='hit';state.modal='source';render();return}if(a==='ask-selected'){state.tab='ask';state.query='这篇「'+(DOCS.find(x=>x.id===state.selected)||DOCS[0]).title+'」主要讲了什么？';state.intent='answer';render();return}
if(a==='new-query'){state.query='我记得一篇文章提过持久化记忆和长上下文的区别';state.intent='find';state.scenario='hit';state.phase='idle';render();return}if(a==='action-answer'){state.intent='answer';render();return}if(a==='action-compare'||a==='insight-compare'){state.intent='compare';state.tab='ask';state.query='比较已选文章对长期记忆的不同侧重';state.scenario='hit';render();return}if(a==='dismiss-insight'){state.modal='info';render();return}if(a==='inspect-old'){state.tab='notes';state.selected='m4';render();return}if(a==='create-proposal'){state.tab='review';render();return}
if(a.startsWith('proposal-')){state.selectedProposal=a.slice(9);render();return}if(a==='reject'){state.proposalState='rejected';render();return}if(a==='approve'){if(state.proposalState==='applied')return;state.proposalState='applied';render();return}if(a==='undo'){state.proposalState='pending';render();return}if(a==='check-file'){state.modal='conflict';render();return}if(a==='reset-proposal'){state.proposalState='pending';state.modal='';render();return}state.modal='info';render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){state.modal='';state.settings=false;render()}});
render();
</script></body></html>
