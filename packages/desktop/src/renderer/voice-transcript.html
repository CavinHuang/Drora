<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Drora 语音转写</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font:
          13px -apple-system,
          system-ui,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      @keyframes voice-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes voice-caret {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      @keyframes voice-wave {
        0%,
        100% {
          height: 5px;
        }
        50% {
          height: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./voice-transcript/voiceTranscriptApp.tsx"></script>
  </body>
</html>
