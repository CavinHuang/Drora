<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f5" />
    <title>Drora Remote</title>
    <script>
      // 首帧主题：对齐官方壳——localStorage 快照 + 系统偏好（spec §6 凭据/壳态快照语义）。
      (function () {
        try {
          var stored = localStorage.getItem("drora-mobile-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* storage 不可用时走系统偏好已在上处理 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
