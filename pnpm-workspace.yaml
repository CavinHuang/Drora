packages:
  - packages/*
  - apps/drora-cli
  - apps/drora-cli/packages/*
  - apps/drora-cli/tools/*
  # 官方插件包是 seed 资产（内容即源码 / 预编译 runtime），不参与本仓库构建；
  # 排除以免 install 解析它们的独立依赖（如 zcode-cua-plugin 的 catalog: 协议）。
  - "!apps/drora-cli/packages/android-emulator-plugin"
  - "!apps/drora-cli/packages/documents-plugin"
  - "!apps/drora-cli/packages/image-search-plugin"
  - "!apps/drora-cli/packages/ios-simulator-plugin"
  - "!apps/drora-cli/packages/obsidian-plugin"
  - "!apps/drora-cli/packages/pdf-plugin"
  - "!apps/drora-cli/packages/plugin-creator-plugin"
  - "!apps/drora-cli/packages/presentations-plugin"
  - "!apps/drora-cli/packages/restore-legacy-sessions-plugin"
  - "!apps/drora-cli/packages/skill-creator-plugin"
  - "!apps/drora-cli/packages/spreadsheets-plugin"
  - "!apps/drora-cli/packages/zcode-cua-plugin"
  - "!apps/drora-cli/packages/drora-guide-plugin"
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  cpu-features: true
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
