          <p data-i18n="doc.tasks.p1">
            桌面应用以任务组织日常工作：每个任务有独立的会话、工具执行与 Git 上下文。对多步骤的复杂目标，用 Goal
            承载长程计划——Agent 持续规划、执行与验证，进度面板逐步打勾，你随时可以查看状态或补充指令。
          </p>
