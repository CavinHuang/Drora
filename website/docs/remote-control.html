          <h1 data-i18n="doc.nav.remote">手机远控</h1>
          <p data-i18n="doc.remote.p1">
            在桌面端开启远程访问后，用手机浏览器扫码或输入地址即可连接：桌面已有 Host 会被复用，同一会话运行时继续工作，不另起
            Agent。局域网内可直连；跨网络时经 relay 云中继转发——relay 只做鉴权、配对、心跳与转发，不保存任务队列等业务状态。
          </p>
          <p data-i18n="doc.remote.p2">连接断开后自动恢复，历史事件可回放；窗口关闭即停止服务，不会在后台滞留。</p>
